
name: Проверка

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: pr-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Рабочая нагрузка android
        run: dotnet workload install android

      - name: Платформа Android 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Сборка приложения
        run: dotnet build WheelTalk.Droid -c Release -f net10.0-android

      - name: Сборка стенда
        run: dotnet build WheelTalk.Lab.Droid -c Release -f net10.0-android

      - name: Тесты
        run: dotnet test WheelTalk.Tests
