# владелец пушит тег `v<версия>` — сборка собирает подписанный APK и кладёт его в ЧЕРНОВИК
# релиза. Черновик, а не готовый релиз: текст релиза пишет человек (docs/release.md, шаг 3),
# машина заполняет только то, что умеет посчитать — размер, отпечаток файла, имя.
#
# Ручной запуск (workflow_dispatch) собирает то же самое, но релиз не трогает и кладёт APK в
# артефакты прогона. Им проверяют саму сборку, не выпуская ничего наружу.
#
# Выпуск возможен только из master: тег обязан стоять на коммите, уже влитом туда, — см. шаг
# «Тег должен быть в master» ниже.
name: Выпуск

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # нужно для создания релиза; на ручном запуске не используется

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Тег должен быть в master
        if: github.event_name == 'push'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "Тег ${GITHUB_REF_NAME} стоит на коммите, которого нет в master."
            echo "Порядок — docs/release.md, шаг 4: мерж --ff-only в master, затем тег."
            exit 1
          fi

      # .NET Android требует JDK 17. На раннере JDK несколько, поэтому выбираем явно.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Рабочая нагрузка android
        run: dotnet workload install android

      - name: Платформа Android 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Тесты
        run: dotnet test WheelTalk.Tests

      - name: Разложить ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "Нет секретов ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD."
            echo "Без них сборка подписалась бы отладочным ключом и поверх установленного"
            echo "приложения не встала бы — это хуже, чем не собраться вовсе."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/wheeltalk-release.keystore"
          printf '%s\n%s\n' "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > "$RUNNER_TEMP/storepass.txt"

      - name: Публикация
        run: |
          dotnet publish WheelTalk.Droid -c Release -f net10.0-android \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$RUNNER_TEMP/wheeltalk-release.keystore" \
            -p:AndroidSigningKeyAlias=wheeltalk \
            -p:AndroidSigningStorePass="file:$RUNNER_TEMP/storepass.txt" \
            -p:AndroidSigningKeyPass="file:$RUNNER_TEMP/storepass.txt"

      - name: Имя APK и сверка с тегом
        id: apk
        run: |
          VERSION=$(sed -n 's:.*<ApplicationDisplayVersion>\(.*\)</ApplicationDisplayVersion>.*:\1:p' \
            WheelTalk.Droid/WheelTalk.Droid.csproj)
          if [ -z "$VERSION" ]; then echo "Не нашёл ApplicationDisplayVersion в csproj"; exit 1; fi

          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            # Допустимы «v1.3.0» и «v1.3.0-b10» — вторая и следующие сборки того же номера.
            case "$TAG" in
              "v$VERSION"|"v$VERSION-b"*) ;;
              *) echo "Тег $TAG не соответствует версии $VERSION в csproj"; exit 1 ;;
            esac
          fi

          NAME="wheeltalk-$VERSION-arm64.apk"
          SRC=WheelTalk.Droid/bin/Release/net10.0-android/publish/com.wheeltalk.droid-Signed.apk
          mv "$SRC" "$RUNNER_TEMP/$NAME"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "path=$RUNNER_TEMP/$NAME" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$RUNNER_TEMP/$NAME" | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/$NAME" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Проверить подпись
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify -v --print-certs \
            "${{ steps.apk.outputs.path }}"

      - name: Артефакт прогона
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}

      - name: Черновик релиза
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Текст релиза — из docs/releases/<версия>.md, если он есть и не пуст: его пишет агент
          # при подготовке выпуска (docs/release.md, шаг 3), и тогда черновик готов к публикации
          # как есть. Файл именной, на свою версию, — чужой текст не подхватится никогда: нет
          # файла или он пуст — старая схема, черновик с напоминанием дописать руками.
          # Измеримое (файл, размер, подпись, SHA-256) машина добавляет в конце в любом случае.
          NOTES_SRC="docs/releases/${{ steps.apk.outputs.version }}.md"
          if [ -s "$NOTES_SRC" ]; then
            cat "$NOTES_SRC" > "$RUNNER_TEMP/notes.md"
            echo "" >> "$RUNNER_TEMP/notes.md"
          else
            cat > "$RUNNER_TEMP/notes.md" <<EOF
          Полное описание изменений — [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md).

          <!-- Дописать перед публикацией: что не проверено на живых колёсах; что выглядит регрессией и почему ею не является. Или заранее положить текст в docs/releases/<версия>.md — тогда черновик приходит готовым. -->

          EOF
          fi

          cat >> "$RUNNER_TEMP/notes.md" <<EOF
          **Файл.** \`${{ steps.apk.outputs.name }}\`, ${{ steps.apk.outputs.size }}, одна архитектура \`arm64-v8a\`, minSdk 28 (Android 9).
          Подпись — своим ключом, схема v3, отпечаток сертификата в [docs/release.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/release.md).

          \`\`\`
          SHA-256 (APK)  ${{ steps.apk.outputs.sha256 }}
          \`\`\`
          EOF

          gh release create "${{ github.ref_name }}" "${{ steps.apk.outputs.path }}" \
            --draft \
            --title "WheelTalk ${{ steps.apk.outputs.version }}" \
            --notes-file "$RUNNER_TEMP/notes.md"
