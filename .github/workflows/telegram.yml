# Анонс выпуска в Telegram-канал: срабатывает, когда владелец жмёт «Publish release» на
# черновике, — событие `published` черновики не поднимают, поэтому недопубликованное бот не
# разболтает никогда. Ручной прогон сборки (workflow_dispatch в release.yml) сюда тоже не попадает.
#
# Второй вход — ручной запуск с именем тега: релизное событие исполняет файл с коммита тега, и
# починка воркфлоу до уже опубликованного релиза иначе не дотягивается (первый выпуск 1.4.1 так и
# остался без анонса — отсюда и вход).
#
# Краткое описание берётся из аннотации тега — по конвенции release.md это одна строка сути
# («Версия 1.4.1 — …»), и она уже пишется на каждый выпуск; второго текста не заводим, чтобы им
# не расходиться. Полное описание остаётся по ссылке на релиз.
#
# Нужны два секрета (Settings → Secrets → Actions):
#   TELEGRAM_BOT_TOKEN — токен бота от @BotFather;
#   TELEGRAM_CHAT_ID   — канал: @имя_канала или числовой -100…; бот должен быть админом канала.
# Секретов нет — шаг честно падает с подсказкой, а не молчит: анонс, который «не случился и не
# сказал почему», хуже отсутствия анонса.
name: Анонс в Telegram

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег опубликованного релиза, например v1.4.1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest

    env:
      # Одно имя на оба входа: событие приносит тег релизом, ручной запуск — полем формы.
      TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Подпись анонса
        id: summary
        run: |
          # Подпись — из файла docs/releases/<версия>.tg.txt, если он есть и не пуст: его пишет
          # агент при подготовке выпуска тем же коммитом, что раздел CHANGELOG и номера
          # (docs/release.md, шаг 3), и тогда в канал уходит написанное человеком слово, а не
          # техническая строка. Файл именной, на свою версию, — чужая подпись не подхватится.
          #
          # Нет файла — старая схема: subject аннотации тега (первая строка `git tag -a -m`);
          # нет и её (лёгкий тег) — имя тега. Анонс не должен падать из-за забытого файла.
          #
          # Подпись Telegram ограничена 1024 знаками — файл длиннее обрезается честно, с
          # многоточием, а не ошибкой отправки. Запас под ссылку на релиз — 100 знаков.
          VERSION="${TAG#v}"; VERSION="${VERSION%%-b*}"
          NOTES="docs/releases/${VERSION}.tg.txt"

          if [ -s "$NOTES" ]; then
            SUBJECT=$(head -c 900 "$NOTES")
            if [ "$(wc -c < "$NOTES")" -gt 900 ]; then SUBJECT="${SUBJECT}…"; fi
          else
            SUBJECT=$(git for-each-ref "refs/tags/${TAG}" --format='%(contents:subject)')
          fi
          if [ -z "$SUBJECT" ]; then SUBJECT="WheelTalk ${TAG}"; fi
          {
            echo "text<<EOF"
            echo "$SUBJECT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: APK из релиза
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Скачанное проверяется здесь же, а не доверяется следующему шагу: пустая переменная у
        # curl падает невнятным «(26) Failed to open/read local data» — так выглядел первый
        # прогон, и по ошибке было не понять, что файла просто нет.
        run: |
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern '*.apk' --dir apk
          ls -la apk/
          APK=$(find apk -name '*.apk' | head -1)
          if [ ! -s "$APK" ]; then
            echo "APK из релиза $TAG не скачался — выше листинг того, что пришло."
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
        id: apk

      - name: Отправка в канал
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUMMARY: ${{ steps.summary.outputs.text }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ env.TAG }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "Нет секретов TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID — анонс отправлять нечем."
            echo "Завести: бот у @BotFather, бота админом в канал, оба значения в Secrets → Actions."
            exit 1
          fi

          # Файл — глазами до отправки: curl про недоступный файл говорит загадочное «(26)», и два
          # прогона подряд ушли на перевод с его языка.
          ls -la "$APK"

          CAPTION="$SUMMARY

          $RELEASE_URL"

          # Один sendDocument с подписью, а не текст плюс файл: два сообщения в канале — это два
          # уведомления об одном выпуске. Текстовые поля — --form-string, а не -F: он не толкует
          # содержимое (ни @, ни <, ни переносы строк), и подпись не может превратиться в попытку
          # читать файл. Подпись без parse_mode: markdown релиза телеграм всё равно не поймёт.
          if ! curl -sS --fail-with-body \
            --form-string chat_id="$CHAT_ID" \
            --form-string caption="$CAPTION" \
            -F document=@"$APK" \
            "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"; then

            # Отказ раскладывается на части: жив ли токен — getMe, канал ничего не получает.
            echo ""
            echo "sendDocument не прошёл. Проба токена (getMe):"
            curl -sS "https://api.telegram.org/bot$BOT_TOKEN/getMe" || true
            exit 1
          fi
